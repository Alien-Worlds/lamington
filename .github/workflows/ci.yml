name: CI

on:
  push:
    branches: [master]
  pull_request:

# Nothing here needs write access to the repository
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run redundant
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches .tool-versions so CI and local runs agree
          node-version: '18.20.4'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn check:types

      - run: yarn test

  package:
    name: Packaged install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.4'
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Packs the module and installs the tarball into an empty project. This is
      # a separate job because it is the only check that sees the package the
      # way a consumer does: the test suite above runs inside this repo, where
      # devDependencies are present, so it cannot notice a runtime dependency
      # declared in the wrong section. That mistake shipped in 1.2.0 and 1.3.0.
      - run: yarn verify:package

  compile:
    name: Contract compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.4'
          cache: yarn

      - run: yarn install --frozen-lockfile

      # The CLI is driven from lib/, the way a consumer gets it.
      - run: yarn build

      - name: Derive the chain image tag
        id: image
        run: echo "tag=$(node scripts/chain-image.js --tag)" >> "$GITHUB_OUTPUT"

      - name: Use the prebuilt chain image if there is one
        continue-on-error: true
        env:
          TAG: ${{ steps.image.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          REMOTE="ghcr.io/${OWNER,,}/lamington-chain:${TAG}"
          docker pull "$REMOTE"
          docker tag "$REMOTE" "lamington:${TAG}"

      # Compiles a contract the way a consumer does, from a project directory of
      # its own. This exists because nothing else in CI ever reaches the
      # compiler: the unit tests never touch docker, verify:package only runs
      # --help, and the integration suite starts a chain without building
      # anything. Issue #69 -- contracts compile as root, so the output
      # directory is root-owned and lamington cannot write its own .mod.json
      # stamp into it -- reached a consumer's CI precisely because of that gap.
      #
      # It cannot be reproduced on macOS: Docker Desktop maps ownership through
      # its VM, so this only fails on a Linux host with native docker.
      #
      # The fixture config is deliberately near-empty so the toolchain matches
      # DEFAULT_CONFIG, and therefore the prebuilt image pulled above. The
      # repository's own .lamingtonrc pins an older toolchain and would miss it.
      #
      # lamington-build.js is invoked directly rather than through
      # `lamington build`: dispatching subcommands by path is broken until #61
      # lands, and that is a separate bug from the one under test here.
      - name: Compile a contract as a consumer would
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/compile-fixture"
          mkdir -p "$WORK/contracts"
          cp contracts/example.cpp "$WORK/contracts/"
          # A container name and ports of its own, so this never collides with
          # another chain -- including when someone runs these steps locally.
          cat > "$WORK/.lamingtonrc" <<'JSON'
          {
            "outDir": "artifacts",
            "keepAlive": false,
            "containerName": "lamington-compile",
            "rpcPort": 8855,
            "stateHistoryPort": 18055,
            "p2pPort": 19855
          }
          JSON
          cd "$WORK"
          node "$GITHUB_WORKSPACE/lib/cli/lamington-build.js"

      # Asserts rather than reports. This failure is structurally invisible on
      # macOS -- Docker Desktop maps ownership through its VM -- so CI is the
      # only place a regression of #69 could ever appear. Printing alone would
      # let one scroll past inside a green run, and it would come back as a pile
      # of unexplained EACCES failures rather than a named cause.
      - name: Assert build artifacts belong to the build user
        if: always()
        run: |
          set -uo pipefail
          ARTIFACTS="$RUNNER_TEMP/compile-fixture/artifacts"

          echo "runner uid:gid = $(id -u):$(id -g)"

          if [ ! -d "$ARTIFACTS" ]; then
            echo "no artifacts directory was produced"
            exit 0
          fi

          find "$ARTIFACTS" -maxdepth 4 -exec ls -land {} +

          FOREIGN="$(find "$ARTIFACTS" -not -user "$(id -u)" -print)"
          if [ -n "$FOREIGN" ]; then
            echo "::error::Build artifacts are not owned by the build user. This is a"
            echo "::error::regression of #69: the compiler is running as root again, so a"
            echo "::error::developer on Linux cannot delete their own build output."
            echo "$FOREIGN"
            exit 1
          fi

          echo "all build artifacts owned by $(id -u)"

  integration:
    name: Chain integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.4'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Derive the chain image tag
        id: image
        run: echo "tag=$(node scripts/chain-image.js --tag)" >> "$GITHUB_OUTPUT"

      # Give the prebuilt image the local name startEos() looks for, so
      # imageExists() is satisfied and nothing is built. This is an optimisation
      # only: if the image was never published, or the toolchain moved before the
      # publish workflow ran, the tests still pass, they just build it first.
      - name: Use the prebuilt chain image if there is one
        continue-on-error: true
        env:
          TAG: ${{ steps.image.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          REMOTE="ghcr.io/${OWNER,,}/lamington-chain:${TAG}"
          docker pull "$REMOTE"
          docker tag "$REMOTE" "lamington:${TAG}"

      # Asserts that startEos returns a chain that is actually usable: nodeos
      # answers RPC well before the system contracts are installed, and v1.4.0
      # shipped returning in that gap.
      - run: yarn test:integration
