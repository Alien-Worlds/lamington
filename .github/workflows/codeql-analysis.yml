name: 'CodeQL'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '20 15 * * 0'

# Least privilege: the analysis only needs to read the code and upload results
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      # Required to upload the results to the code scanning dashboard
      security-events: write
      # Required by the action to read the workflow run status
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers both; this project is TypeScript compiled to JS
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # No Autobuild step: it is a no-op for interpreted languages, and this
      # project has no compiled code for CodeQL to build.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
